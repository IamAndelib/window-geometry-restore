name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches metadata.json version
        run: |
          version=$(node -p "require('./src/metadata.json').KPlugin.Version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match metadata.json version $version"
            exit 1
          fi

      - name: Run tests
        run: make test

      - name: Build package
        run: make build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" windowgeometryrestore.kwinscript --title "${GITHUB_REF_NAME}" --generate-notes
