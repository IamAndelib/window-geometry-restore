name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: |
          node tests/engine.mjs
          node tests/lifecycle.mjs

      - name: Build package
        run: make build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" windowgeometryrestore.kwinscript --title "${GITHUB_REF_NAME}" --generate-notes
